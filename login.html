<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-Pesa Checkout Flow</title>
</head>
<body>

    <!-- 1. The Package Card Trigger -->
    <div id="packageName" data-package="Normal" onclick="userData()" style="background-color: aquamarine; padding: 15px; cursor: pointer; border-radius: 5px; width: fit-content;">
        <p id="amount" data-amount="10">KES 10</p>
        <p id="duration" data-duration="1hr">1 hr</p>
    </div>

    <!-- 2. The Input Screen (Hidden by default, shown when card clicked) -->
    <div class="paymentOption" id="step-input" style="display: none; margin-top: 20px;">
        <h3 id="display-duration">Payment For </h3>
        <h4 id="display-amount">Amount: </h4>
        <h2>Enter Phone Number</h2>
        <input type="text" name="phone_no" id="phone_no" placeholder="0722.... or 011....">
        <button id="pay_btn">Pay</button>
    </div>

    <!-- 3. The Loading Screen (Hidden by default) -->
    <div class="awaitPayment" id="step-loading" style="display: none; margin-top: 20px;">
        <h3>Awaiting Payment</h3>
        <span class="spinner"></span>
        <p>Stk has been sent to <strong id="display_phone"></strong>.</p>
        <p>Please Confirm Payment on your phone.</p>
    </div>

    <script>
        // Global variables to capture text slots inside the checkout card
        const inputScreen = document.querySelector('#step-input');
        const loadingScreen = document.querySelector('#step-loading');
        const displayDuration = document.querySelector('#display-duration');
        const displayAmount = document.querySelector('#display-amount');
        
        let selectedUserObj = null; // Holds our active dataset package state

        // Activated when user clicks the aquamarine div
        function userData() { 
            const packageName = document.querySelector('#packageName'); 
            const amount = document.querySelector('#amount'); 
            const duration = document.querySelector('#duration'); 
            
            selectedUserObj = { 
                packageName: packageName.dataset.package, 
                Amount: amount.dataset.amount, 
                duration: duration.dataset.duration 
            }; 
            
            console.log("Selected Package Data:", selectedUserObj); 

            // Safely write dynamic data to the input form screen text slots
            displayDuration.textContent = `Payment For ${selectedUserObj.duration}`;
            displayAmount.textContent = `Amount: KES ${selectedUserObj.Amount}`;

            // Reveal the payment window
            inputScreen.style.display = 'block';
            loadingScreen.style.display = 'none';

            // Fire event hookups
            initializePayButton();
        }

        function initializePayButton() {
            const payBtn = document.querySelector('#pay_btn');
            
            // Remove previous event listener clones to avoid double firing triggers
            payBtn.replaceWith(payBtn.cloneNode(true));
            
            // Re-target the cleaned up element
            const cleanPayBtn = document.querySelector('#pay_btn');
            const phoneInput = document.querySelector('#phone_no');
            const displayPhone = document.querySelector('#display_phone');

            cleanPayBtn.addEventListener('click', () => {
                const phoneNumber = phoneInput.value.trim();

                if (!phoneNumber) {
                    alert("Please enter a valid phone number.");
                    return;
                }

                // Push values to confirmation screen
                displayPhone.textContent = phoneNumber;

                // Toggle visibility steps
                inputScreen.style.display = 'none';
                loadingScreen.style.display = 'block';

                console.log(`Initiating STK Push for ${phoneNumber} for amount ${selectedUserObj.Amount}`);
                initiateStkPush(phoneNumber, selectedUserObj.Amount);
            });
        }

        async function initiateStkPush(phone, amount) {
            try {
                const response = await fetch('https://mpesastk-rbaz.onrender.com/pay/client', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ phone, amount })
                });
                const data = await response.json();
                console.log("Server API response structural data returned:", data);
            } catch (error) {
                console.error("Payment trigger failed", error);
            }
        }
    </script>
</body>
</html>
