<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M-Pesa Checkout Flow</title>
    <style>
        .package-card {
            background-color: aquamarine; 
            padding: 15px; 
            cursor: pointer; 
            border-radius: 5px; 
            width: fit-content;
            margin-bottom: 10px; 
        }
        /* Optional basic style for the spinner */
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(0,0,0,.1);
            border-radius: 50%;
            border-top-color: #000;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- 1. The Package Card Trigger -->
    <div class="package-card" data-package="Normal" data-amount="1" data-duration="1hr" onclick="userData(this)"> 
        <p class="package-amount">KES 1</p> 
        <p class="package-duration">1 hr</p> 
    </div> 

    <div class="package-card" data-package="Normal" data-amount="10" data-duration="5hr" onclick="userData(this)"> 
        <p class="package-amount">KES 10</p> 
        <p class="package-duration">5 hr</p> 
    </div> 

    <div class="package-card" data-package="Normal" data-amount="15" data-duration="12hr" onclick="userData(this)"> 
        <p class="package-amount">KES 15</p> 
        <p class="package-duration">12 hr</p> 
    </div> 

    <div class="package-card" data-package="Normal" data-amount="20" data-duration="24hr" onclick="userData(this)"> 
        <p class="package-amount">KES 20</p> 
        <p class="package-duration">24 hr</p> 
    </div>

    <!-- 2. The Input Screen -->
    <div class="paymentOption" id="step-input" style="display: none; margin-top: 20px;">
        <h3 id="display-duration">Payment For </h3>
        <h4 id="display-amount">Amount: </h4>
        <h2>Enter Phone Number</h2>
        <input type="text" name="phone_no" id="phone_no" placeholder="0722.... or 011....">
        <button id="pay_btn">Pay</button>
    </div>

    <!-- 3. The Loading Screen -->
    <div class="awaitPayment" id="step-loading" style="display: none; margin-top: 20px;">
        <h3>Awaiting Payment</h3>
        <span class="spinner"></span>
        <p>STK push has been sent to <strong id="display_phone"></strong>.</p>
        <p>Please confirm the transaction by entering your M-Pesa PIN on your phone.</p>
    </div>

    <script>
        // Global element references mapped directly to actual HTML IDs
        const inputScreen = document.querySelector('#step-input');
        const loadingScreen = document.querySelector('#step-loading');
        const displayDuration = document.querySelector('#display-duration');
        const displayAmount = document.querySelector('#display-amount');
        
        let selectedUserObj = null; 

        // Triggered when a user selects a card
        function userData(element) { 
            selectedUserObj = { 
                packageName: element.dataset.package, 
                Amount: element.dataset.amount, 
                duration: element.dataset.duration 
            }; 
            
            console.log("Selected Package Data:", selectedUserObj); 

            // Safely write dynamic data to the input form screen text slots
            displayDuration.textContent = `Payment For ${selectedUserObj.duration}`;
            displayAmount.textContent = `Amount: KES ${selectedUserObj.Amount}`;

            // Handle panel state switches
            inputScreen.style.display = 'block';
            loadingScreen.style.display = 'none';

            // Bind transaction trigger events
            initializePayButton();
        }

        function initializePayButton() {
            const payBtn = document.querySelector('#pay_btn');
            
            // Remove previous event listener clones to avoid double-firing triggers
            payBtn.replaceWith(payBtn.cloneNode(true));
            
            // Re-target the freshly cleaned button node
            const cleanPayBtn = document.querySelector('#pay_btn');
            const phoneInput = document.querySelector('#phone_no');
            const displayPhone = document.querySelector('#display_phone');

            cleanPayBtn.addEventListener('click', () => {
                const phoneNumber = phoneInput.value.trim();
                console.log(phoneNumber)

                // Remove common formatting characters to check the actual digit count
                const cleanNumber = phoneNumber ? phoneNumber.toString().replace(/\D/g, '') : '';
                console.log(cleanNumber)
                if (!cleanNumber || cleanNumber.length < 10) { 
                alert("Please enter a valid phone number."); 
                return; 
                }


                // Push values to confirmation screen
                displayPhone.textContent = phoneNumber;
                console.log(displayPhone)

                // Toggle visibility steps
                inputScreen.style.display = 'none';
                loadingScreen.style.display = 'block';

                console.log(`Initiating STK Push for ${phoneNumber} for amount ${selectedUserObj.Amount}`);
                
                // Fire off the API payment request
                initiateStkPush(
                    selectedUserObj.packageName, 
                    selectedUserObj.duration, 
                    phoneNumber, 
                    selectedUserObj.Amount
                );
            });
        }

        // POST request to your Express server running on Render
        async function initiateStkPush(packageName, duration, phone, amount) {
            console.log(packageName)
            try {
                const response = await fetch('https://mpesastk-rbaz.onrender.com/pay/client', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        phone: phone,
                        amount: Number(amount), 
                        package: packageName,   
                        duration: duration 
                    })
                });
                const data = await response.json();
                console.log("Server API response structural data returned:", data);
            } catch (error) {
                console.error("Payment trigger failed", error);
            }
        }
    </script>
</body>
</html>
